services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord-afk-voice-bot
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
